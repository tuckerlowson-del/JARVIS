name: JARVIS Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-release
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        shell: pwsh
        run: |
          Get-ChildItem -Path src -Filter *.js -Recurse | ForEach-Object {
            node --check $_.FullName
          }

      - name: Build Windows installer and update metadata
        run: npx electron-builder --win nsis --publish never

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "JARVIS version: $v"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: JARVIS v${{ steps.version.outputs.version }}
          target_commitish: main
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          overwrite_files: true
          files: |
            dist/JARVIS-Setup-*.exe
            dist/latest.yml
            dist/*.blockmap
