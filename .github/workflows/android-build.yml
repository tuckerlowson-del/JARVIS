name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'AndroidManifest.xml'
      - 'MainActivity.java'
      - 'JarvisAccessibilityService.java'
      - 'accessibility_service_config.xml'
      - 'activity_main.xml'
      - 'colors.xml'
      - 'strings.xml'
      - 'styles.xml'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
