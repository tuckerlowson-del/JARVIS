<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070a11"><link rel="manifest" href="/assets/manifest.json"><link rel="stylesheet" href="/assets/style.css"><title>JARVIS Mobile</title></head><body><main><header><b>JARVIS</b><small>MOBILE REMOTE</small></header><section id="pair" class="card"><h2>Pair with your PC</h2><p>Enter the 5-letter pairing token shown on JARVIS.</p><input id="token" maxlength="5" placeholder="ABCDE"><button id="pairBtn">Pair device</button><p id="pairError"></p></section><section id="app" hidden><div id="status">PC online</div><div class="stats"><div><small>CPU</small><b id="cpu">--</b></div><div><small>RAM</small><b id="ram">--</b></div><div><small>GPU</small><b id="gpu">--</b></div></div><div class="card"><h3>Windows Control</h3><button data-launch="chrome">Chrome</button><button data-launch="vscode">VS Code</button><button data-launch="explorer">Explorer</button><button data-action="volume-up">Volume +</button><button data-action="volume-down">Volume −</button><button data-action="volume-mute">Mute</button><button data-action="brightness-up">Brightness +</button><button data-action="brightness-down">Brightness −</button><button id="lock">Lock PC</button></div><div class="card"><h3>Ask JARVIS</h3><div id="messages"></div><input id="prompt" placeholder="Type a command"><button id="send">Send</button></div></section></main><script src="/assets/app.js"></script></body></html>
